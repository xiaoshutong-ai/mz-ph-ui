name: Public Frontend Security Gate

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main push
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout PR candidate read-only
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify public frontend boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path("index.html"), Path("workspace.html"), Path("account.html"), Path("style.css"), Path("entry.js"), Path("account.js"), Path("app.js"), Path("README.md"), Path("SECURITY.md")]
          text = "\n".join(p.read_text(encoding="utf-8") for p in files if p.exists())
          root = Path("index.html").read_text(encoding="utf-8")
          workspace = Path("workspace.html").read_text(encoding="utf-8")
          account = Path("account.html").read_text(encoding="utf-8")
          entry_js = Path("entry.js").read_text(encoding="utf-8")
          account_js = Path("account.js").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          studyroom = Path("studyroom.html").read_text(encoding="utf-8")


          # Whole-repository public-boundary audit. This intentionally scans tracked
          # source, not only the Pages files, because the GitHub repository itself is public.
          tracked = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              rel = path.as_posix().removeprefix("./")
              if rel.startswith("_site/"):
                  continue
              if path.is_symlink():
                  raise SystemExit("tracked symlink forbidden in public repository: " + rel)
              if path.stat().st_size > 1_000_000:
                  raise SystemExit("tracked file exceeds 1 MB public-repo limit: " + rel)
              tracked.append((rel, path))

          allowed_exact = {
              ".nojekyll",
              "README.md",
              "SECURITY.md",
              "AGENTS.md", "studyroom.html",
              "index.html",
              "workspace.html",
              "account.html",
              "style.css",
              "entry.js",
              "account.js",
              "app.js",
              ".github/workflows/pages.yml",
              ".github/workflows/security.yml", "status-public.js", "devices.html",
          }
          allowed_prefixes = (
              "updates/",
          )
          for rel, _path in tracked:
              if rel in allowed_exact or any(rel.startswith(prefix) for prefix in allowed_prefixes):
                  continue
              raise SystemExit("unexpected tracked path in public repository: " + rel)

          if any(rel.startswith("supabase/") for rel, _path in tracked):
              raise SystemExit("server-side Supabase source is forbidden in public repository")

          repo_text_parts = []
          for rel, path in tracked:
              try:
                  value = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  raise SystemExit("binary tracked file forbidden in public repository: " + rel)
              repo_text_parts.append(value)
          repo_text = "\n".join(repo_text_parts)

          secret_patterns = {
              "private-key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              "supabase-secret": r"\bsb_secret_[A-Za-z0-9._-]{12,}",
              "openai-like": r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}",
              "google-api": r"\bAIza[A-Za-z0-9_-]{20,}",
              "aws-access-key": r"\bAKIA[0-9A-Z]{16}\b",
              "jwt": r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b",
          }
          for label, pattern in secret_patterns.items():
              if re.search(pattern, repo_text):
                  raise SystemExit("secret-shaped value found in public repository: " + label)

          security_workflow = Path(".github/workflows/security.yml").read_text(encoding="utf-8")
          if "pull_request_target:" not in security_workflow:
              raise SystemExit("security workflow must use trusted pull_request_target")
          if "\n  pull_request:\n" in security_workflow:
              raise SystemExit("untrusted pull_request trigger is forbidden for security gate")
          persist_marker = "persist-credentials:" + " false"
          if sum(line.strip() == persist_marker for line in security_workflow.splitlines()) != 2:
              raise SystemExit("both security checkouts must disable credential persistence")
          if "permissions:\n  contents: read" not in security_workflow:
              raise SystemExit("security workflow permissions must remain read-only")
          security_uses = {
              line.strip() for line in security_workflow.splitlines()
              if line.strip().startswith("uses:")
          }
          expected_security_uses = {
              "uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
          }
          if security_uses != expected_security_uses:
              raise SystemExit("security workflow actions must stay pinned to the approved SHA")
          privileged_markers = (
              "secrets" + ".",
              "github" + ".token",
              "toJson" + "(github)",
              "toJSON" + "(github)",
          )
          for forbidden in privileged_markers:
              if forbidden in security_workflow:
                  raise SystemExit("security workflow may not expose privileged GitHub context: " + forbidden)

          pages = Path(".github/workflows/pages.yml").read_text(encoding="utf-8")
          pages_uses = {
              line.strip() for line in pages.splitlines()
              if line.strip().startswith("uses:")
          }
          expected_pages_uses = {
              "uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
              "uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5",
              "uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4",
              "uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4",
          }
          if pages_uses != expected_pages_uses:
              raise SystemExit("Pages workflow actions must stay pinned to approved SHAs")
          if pages.count("run: |") != 1:
              raise SystemExit("Pages build must contain exactly one local shell block")
          deploy_section = pages.split("\n  deploy:\n", 1)
          if len(deploy_section) != 2 or "run:" in deploy_section[1]:
              raise SystemExit("privileged Pages deploy job must contain no shell execution")
          pages_forbidden_markers = privileged_markers + (
              "curl ",
              "wget ",
              "/dev/tcp",
              "ACTIONS_" + "ID_TOKEN",
          )
          for forbidden in pages_forbidden_markers:
              if forbidden in pages:
                  raise SystemExit("Pages workflow contains forbidden privileged/exfiltration marker: " + forbidden)
          if "contents: write" in pages or "packages: write" in pages or "actions: write" in pages:
              raise SystemExit("Pages workflow must not receive repository write permission")
          if "path: ." in pages or "path: './'" in pages or 'path: "."' in pages:
              raise SystemExit("Pages must never deploy the repository root")
          if "path: _site" not in pages:
              raise SystemExit("Pages artifact must deploy only the staged _site directory")
          if "Build strict Pages allowlist" not in pages:
              raise SystemExit("Pages allowlist staging step missing")

          update_manifest = Path("updates/fuzi/latest.json")
          if update_manifest.exists():
              import json
              from urllib.parse import urlparse
              value = json.loads(update_manifest.read_text(encoding="utf-8"))
              expected_keys = {
                  "schema_version",
                  "product",
                  "channel",
                  "latest_version_code",
                  "latest_version_name",
                  "download_url",
                  "apk_sha256",
                  "apk_size",
                  "signer_cert_sha256",
                  "release_notes",
                  "published_at",
              }
              if set(value) != expected_keys:
                  raise SystemExit("Fuzi update manifest keys must match frozen schema exactly")
              if value["schema_version"] != 1 or value["product"] != "fuzi-partner" or value["channel"] != "stable":
                  raise SystemExit("Fuzi update manifest identity mismatch")
              if not isinstance(value["latest_version_code"], int) or value["latest_version_code"] <= 0:
                  raise SystemExit("invalid Fuzi versionCode")
              if not re.fullmatch(r"\d+\.\d+\.\d+", str(value["latest_version_name"])):
                  raise SystemExit("Fuzi versionName must use stable SemVer")
              if len(str(value["release_notes"])) > 4000:
                  raise SystemExit("Fuzi release notes too long")
              expected_cert = "F98BE0E3E9C11D4F7AED4DE54441AD87D12F99362F45EFAB84C933E9309641CC"
              if value["signer_cert_sha256"] != expected_cert:
                  raise SystemExit("Fuzi signer certificate pin mismatch")

              url = value["download_url"]
              sha = value["apk_sha256"]
              size = value["apk_size"]
              if url is None:
                  if sha is not None or size is not None:
                      raise SystemExit("unpublished Fuzi manifest must not expose SHA/size")
              else:
                  parsed = urlparse(url)
                  if parsed.scheme != "https" or parsed.netloc != "github.com":
                      raise SystemExit("Fuzi APK download must use HTTPS github.com")
                  prefixes = (
                      "/EmilioJI/mz-ph-ui/releases/download/fuzi-v",
                      "/xiaoshutong-ai/mz-ph-ui/releases/download/fuzi-v",
                  )
                  if not any(parsed.path.startswith(prefix) for prefix in prefixes) or not parsed.path.endswith(".apk"):
                      raise SystemExit("Fuzi APK URL escaped approved release namespace")
                  if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{64}", sha):
                      raise SystemExit("Fuzi APK SHA-256 invalid")
                  if not isinstance(size, int) or size <= 0 or size > 100 * 1024 * 1024:
                      raise SystemExit("Fuzi APK size violates release limit")
                  import urllib.request
                  tag = "fuzi-v" + str(value["latest_version_name"])
                  asset_name = "FuziPartner-v" + str(value["latest_version_name"]) + ".apk"
                  api_url = (
                      "https://api.github.com/repos/xiaoshutong-ai/mz-ph-ui/releases/tags/"
                      + tag
                  )
                  request = urllib.request.Request(
                      api_url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "mz-ph-ui-public-security-gate",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=10) as response:
                          release = json.load(response)
                  except Exception as error:
                      raise SystemExit("approved Fuzi Release metadata is unavailable") from error

                  if release.get("draft") or release.get("prerelease"):
                      raise SystemExit("Fuzi stable manifest may not reference draft/prerelease")
                  assets = [
                      asset for asset in release.get("assets", [])
                      if asset.get("name") == asset_name
                  ]
                  if len(assets) != 1:
                      raise SystemExit("Fuzi Release must contain exactly one approved APK asset")
                  asset = assets[0]
                  if asset.get("state") != "uploaded":
                      raise SystemExit("Fuzi APK asset is not fully uploaded")
                  if int(asset.get("size", -1)) != size:
                      raise SystemExit("Fuzi APK asset size does not match manifest")
                  if str(asset.get("digest") or "").lower() != "sha256:" + sha:
                      raise SystemExit("Fuzi APK asset digest does not match manifest")

          update_policy_v2 = Path("updates/fuzi/v2/policy.json")
          if not update_policy_v2.exists():
              raise SystemExit("Fuzi v2 update policy is required")

          import json
          import urllib.request
          from urllib.parse import urlparse

          policy = json.loads(update_policy_v2.read_text(encoding="utf-8"))
          policy_keys = {
              "schema_version",
              "product",
              "channel",
              "latest_version_code",
              "latest_version_name",
              "minimum_supported_version_code",
              "download_url",
              "apk_sha256",
              "apk_size",
              "signer_cert_sha256",
              "release_notes",
              "published_at",
          }
          if set(policy) != policy_keys:
              raise SystemExit("Fuzi v2 policy keys must match frozen schema exactly")
          if policy["schema_version"] != 2:
              raise SystemExit("Fuzi v2 policy schema_version must be 2")
          if policy["product"] != "fuzi-partner" or policy["channel"] != "stable":
              raise SystemExit("Fuzi v2 policy identity mismatch")

          latest_code = policy["latest_version_code"]
          minimum_code = policy["minimum_supported_version_code"]
          latest_name = str(policy["latest_version_name"])
          if not isinstance(latest_code, int) or latest_code <= 0:
              raise SystemExit("invalid Fuzi v2 latest versionCode")
          if not isinstance(minimum_code, int) or minimum_code <= 0 or minimum_code > latest_code:
              raise SystemExit("invalid Fuzi minimum_supported_version_code")
          if not re.fullmatch(r"\d+\.\d+\.\d+", latest_name):
              raise SystemExit("Fuzi v2 latest versionName must use stable SemVer")
          if len(str(policy["release_notes"])) > 4000:
              raise SystemExit("Fuzi v2 release notes too long")

          expected_cert = "F98BE0E3E9C11D4F7AED4DE54441AD87D12F99362F45EFAB84C933E9309641CC"
          if policy["signer_cert_sha256"] != expected_cert:
              raise SystemExit("Fuzi v2 signer certificate pin mismatch")

          policy_url = policy["download_url"]
          policy_sha = policy["apk_sha256"]
          policy_size = policy["apk_size"]
          parsed = urlparse(policy_url)
          if parsed.scheme != "https" or parsed.netloc != "github.com":
              raise SystemExit("Fuzi v2 APK download must use HTTPS github.com")
          expected_paths = {
              "/EmilioJI/mz-ph-ui/releases/download/" + "fuzi-v" + latest_name + "/FuziPartner-v" + latest_name + ".apk",
              "/xiaoshutong-ai/mz-ph-ui/releases/download/" + "fuzi-v" + latest_name + "/FuziPartner-v" + latest_name + ".apk",
          }
          if parsed.path not in expected_paths or parsed.query or parsed.fragment:
              raise SystemExit("Fuzi v2 APK URL escaped approved Release namespace")
          if not isinstance(policy_sha, str) or not re.fullmatch(r"[0-9a-f]{64}", policy_sha):
              raise SystemExit("Fuzi v2 APK SHA-256 invalid")
          if not isinstance(policy_size, int) or policy_size <= 0 or policy_size > 100 * 1024 * 1024:
              raise SystemExit("Fuzi v2 APK size violates release limit")

          policy_tag = "fuzi-v" + latest_name
          policy_asset_name = "FuziPartner-v" + latest_name + ".apk"
          policy_api_url = (
              "https://api.github.com/repos/xiaoshutong-ai/mz-ph-ui/releases/tags/"
              + policy_tag
          )
          policy_request = urllib.request.Request(
              policy_api_url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mz-ph-ui-public-security-gate",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(policy_request, timeout=10) as response:
                  policy_release = json.load(response)
          except Exception as error:
              raise SystemExit("approved Fuzi v2 Release metadata is unavailable") from error

          if policy_release.get("draft") or policy_release.get("prerelease"):
              raise SystemExit("Fuzi v2 stable policy may not reference draft/prerelease")
          policy_assets = [
              asset for asset in policy_release.get("assets", [])
              if asset.get("name") == policy_asset_name
          ]
          if len(policy_assets) != 1:
              raise SystemExit("Fuzi v2 Release must contain exactly one approved APK asset")
          policy_asset = policy_assets[0]
          if policy_asset.get("state") != "uploaded":
              raise SystemExit("Fuzi v2 APK asset is not fully uploaded")
          if int(policy_asset.get("size", -1)) != policy_size:
              raise SystemExit("Fuzi v2 APK asset size does not match policy")
          if str(policy_asset.get("digest") or "").lower() != "sha256:" + policy_sha:
              raise SystemExit("Fuzi v2 APK asset digest does not match policy")

          # v1 and v2 must describe the same latest immutable stable release.
          if update_manifest.exists():
              v1_value = json.loads(update_manifest.read_text(encoding="utf-8"))
              for key in (
                  "latest_version_code",
                  "latest_version_name",
                  "download_url",
                  "apk_sha256",
                  "apk_size",
                  "signer_cert_sha256",
              ):
                  if policy[key] != v1_value[key]:
                      raise SystemExit("Fuzi v1/v2 latest release metadata drift: " + key)

          for marker in ('id="model_select"', 'id="model_custom"'):
              if marker not in workspace:
                  raise SystemExit("provider model control missing: " + marker)
          if 'id="health"' not in workspace or 'Jev Decision Provider' not in workspace:
              raise SystemExit("provider test or Jev section missing")
          for marker in ('id="mfa"', 'id="mfaCode"', 'id="mfaQr"', 'id="auditLog"', 'Operations Hub'):
              if marker not in workspace:
                  raise SystemExit("Operations Hub security surface missing: " + marker)
          for marker in (
              'id="projectSelect"',
              'id="projectRepo"',
              'id="projectBranch"',
              'id="projectCapabilities"',
              'id="mengzhengModelPresets"',
              'id="mengzhengAiEntitlements"',
              'id="mengzhengProviderConfig"',
              'id="mengzhengJevConfig"',
          ):
              if marker not in workspace:
                  raise SystemExit("multi-project Operations Hub surface missing: " + marker)
          for marker in ('id="projectStatusSnapshot"', 'id="projectStatusSource"'):
              if marker not in workspace:
                  raise SystemExit("project evidence status surface missing: " + marker)
          for marker in (
              'id="projectRuntimeConfig"',
              'id="runtimeConfigFields"',
              'id="runtimeSaveBtn"',
              'id="runtimeAdapterBadge"',
              'id="runtimePresetPanel"',
              'id="runtimePresetBar"',
          ):
              if marker not in workspace:
                  raise SystemExit("project runtime staging surface missing: " + marker)
          for marker in (
              'id="runtimeConsumerPanel"',
              'id="runtimeConsumerToken"',
              'id="runtimeConsumerRotateBtn"',
              'id="runtimeConsumerBadge"',
          ):
              if marker not in workspace:
                  raise SystemExit("runtime consumer provisioning surface missing: " + marker)
          for marker in (
              'data-sr="srChat"',
              'id="srChatDevice"',
              'id="srChatConfigList"',
              'id="srMuseTrusted"',
              'studyroom_config',
              'studyroom_config_save',
              'studyroom_muse_device_save',
              'Owner 信任 Muse 设备',
              '匣固定 API',
              '跟随 Provider Hub',
          ):
              if marker not in studyroom:
                  raise SystemExit("StudyRoom six-seat runtime surface missing: " + marker)
          for forbidden_studyroom_marker in (
              "sb_secret_",
              "SUPABASE_SERVICE_ROLE_KEY",
              "DEEPSEEK_API_KEY",
              "ZHIPUAI_API_KEY",
              "GLM_API_KEY",
              "STUDYROOM_MUSE_WORKER_TOKEN",
          ):
              if forbidden_studyroom_marker in studyroom:
                  raise SystemExit("StudyRoom public secret boundary violated: " + forbidden_studyroom_marker)
          if 'value="MUSE"' not in studyroom or 'value="API"' not in studyroom:
              raise SystemExit("StudyRoom runtime mode controls missing")

          if 'id="projectSelect" disabled' in workspace:
              raise SystemExit("project selector must be driven by authorized memberships")
          for marker in (
              'id="backupTotpStartBtn"',
              'id="backupTotpQr"',
              'id="backupTotpSecret"',
              'id="backupTotpVerifyBtn"',
              'id="totpFactorSummary"',
          ):
              if marker not in workspace:
                  raise SystemExit("backup TOTP security surface missing: " + marker)
          for marker in (
              '/auth/v1/factors',
              '/challenge',
              '/verify',
              'bootstrapAuthenticatedSession',
              'status.aal!=="aal2"',
              'loadAudit',
              'let token=""',
          ):
              if marker not in app:
                  raise SystemExit("MFA/RBAC frontend contract missing: " + marker)
          if 'sessionStorage.setItem("mfa' in app or 'localStorage' in app:
              raise SystemExit("MFA secret/session persistence boundary violated")
          for marker in (
              'loadSecuritySettings',
              'startBackupTotpEnrollment',
              'verifyBackupTotp',
              'cleanupBackupTotp',
              'friendly_name:"MZ Operations Hub Backup"',
          ):
              if marker not in app:
                  raise SystemExit("backup TOTP behavior contract missing: " + marker)
          for marker in (
              'opsMemberships',
              'applyProjectSelection',
              'membershipFor',
              'renderProjectSelection',
              '{project:selectedProjectKey}',
              'selectedProjectKey==="mengzheng"',
              'loadAiEntitlements',
              'entitlement_save',
              'daily_call_limit',
              'XST_*',
              'Judge / Reply / Vision 已独立建模',
          ):
              if marker not in app:
                  raise SystemExit("multi-project isolation contract missing: " + marker)
          for marker in ('projectStatusSnapshot', 'projectStatusSource', 'status_snapshot', 'status_source'):
              if marker not in app:
                  raise SystemExit("project evidence rendering contract missing: " + marker)
          for marker in (
              'loadProjectRuntimeConfig',
              'saveProjectRuntimeConfig',
              'xiaoshutongRuntimeSpecs',
              'jevRuntimeSpecs',
              'data-secret-slot',
              '已保存到独立 Vault（留空保持）',
              '不接管运行时',
              'applyXiaoshutongModelPreset',
              'runtimeGroupMeta',
              'runtimePreset',
              'ZHIPU_GLM47',
              'ZHIPU_GLM53_FLASH',
              'DEEPSEEK_FLASH',
              'API Key 未读取、未覆盖',
              'XIAOSHUTONG_MODEL_PROFILES',
              'validateXiaoshutongRuntimeDraft',
              '模型运行档与 Base URL / Model / Thinking 不一致',
              'minimum_max_tokens',
              '当前模型运行档至少需要',
              'glm-5.3-flash',
              '智谱新一代 Flash · Thinking 必开',
          ):
              if marker not in app:
                  raise SystemExit("staged project runtime contract missing: " + marker)
          for marker in (
              'new Uint8Array(32)',
              'crypto.getRandomValues',
              'sha256Hex(rawToken)',
              'token_sha256:digest',
              'runtime_consumer_rotate',
              'runtimeConsumerRawToken',
              'consumer 仍保持禁用',
          ):
              if marker not in app:
                  raise SystemExit("runtime consumer digest-only contract missing: " + marker)
          for forbidden_runtime_marker in (
              'raw_token:',
              'sessionStorage.setItem("runtimeConsumer',
              'localStorage.setItem("runtimeConsumer',
              'runtime_consumer_enable',
          ):
              if forbidden_runtime_marker in app:
                  raise SystemExit("runtime consumer activation/secret boundary violated: " + forbidden_runtime_marker)
          if 'value=secretStates' in app or 'input.value=secretStates' in app:
              raise SystemExit("saved project secrets must never be prefilled into browser inputs")
          if 'sessionStorage.setItem("backupTotp' in app:
              raise SystemExit("backup TOTP secret must never persist in storage")
          if workspace.index('id="health"') > workspace.index('Jev Decision Provider'):
              raise SystemExit("primary provider test result must stay before Jev section")
          for marker in ('setProviderTestBusy', 'showProviderTestResult', '测试响应中…'):
              if marker not in app:
                  raise SystemExit("primary provider test feedback contract missing: " + marker)
          for marker in (
              'deepseek-flash',
              'deepseek-v4-pro',
              'glm-5.3-flash',
              'gpt-5.6-luna',
              'gpt-5.6-terra',
              'gpt-5.6-sol',
              'applyProviderDefaults',
              'syncBaseUrl',
          ):
              if marker not in app:
                  raise SystemExit("provider linkage contract missing: " + marker)

          for marker in ("AI Provider Hub", "管理员登录", "p2-ai-provider-admin", "api_key"):
              if marker in root:
                  raise SystemExit("operational marker exposed on public root: " + marker)
          if './app.js' in root:
              raise SystemExit("public root must not load operational app.js")
          if './entry.js' not in root:
              raise SystemExit("public root invite callback router missing")
          for marker in (
              '["recovery","signup","email","magiclink"].includes(type)',
              'params.get("error_description")',
              'window.location.replace("./account.html"+hash)',
          ):
              if marker not in entry_js:
                  raise SystemExit("public root recovery callback routing missing: " + marker)
          if 'name="robots"' not in root or "noindex" not in root:
              raise SystemExit("public root noindex directive missing")

          for marker in (
              'id="loginStage"',
              'id="registerStage"',
              'id="recoveryStage"',
              'id="recoveryCode"',
              'id="recoveryVerifyBtn"',
              'id="resetStage"',
              'id="signedInStage"',
          ):
              if marker not in account:
                  raise SystemExit("ordinary account center surface missing: " + marker)
          for marker in (
              '/auth/v1/signup',
              '/auth/v1/token?grant_type=password',
              '/auth/v1/recover',
              '/auth/v1/resend',
              '/auth/v1/user',
              'history.replaceState',
              '/challenge',
              '/verify',
              'renderMfaSecurity',
              'removeSelectedMfa',
              'verifyRecoveryCode',
              'openRequestedAccountStage',
              'mode!=="recovery"',
              'startRecoveryCooldown(60)',
              'window.location.pathname+"?mode=recovery"',
              'body:{type:"recovery",email,token}',
              '验证码已验证。请设置新的登录密码。',
              'code==="same_password"',
              'errorCode==="otp_expired"',
              '新密码不能与当前密码相同，请换一个新密码。',
              '密码重置链接已被使用或已过期，请重新申请密码重置邮件。',
          ):
              if marker not in account_js:
                  raise SystemExit("ordinary account auth contract missing: " + marker)
          for marker in (
              'id="accountMfaFactor"',
              'id="accountMfaCode"',
              'id="accountMfaRemoveBtn"',
              'id="accountMfaReloadBtn"',
          ):
              if marker not in account:
                  raise SystemExit("ordinary account MFA self-service surface missing: " + marker)
          for forbidden_account_marker in (
              'p2-ai-provider-admin',
              'Operations Hub',
              'runtime_consumer',
              'provider.secret.write',
              'mz_ai_admin_token',
          ):
              if forbidden_account_marker in account or forbidden_account_marker in account_js:
                  raise SystemExit("ordinary account center crossed admin boundary: " + forbidden_account_marker)
          if "localStorage" in account_js or "sessionStorage" in account_js:
              raise SystemExit("ordinary account center must not persist auth tokens in browser storage")
          for marker in (
              "window.opener!==null",
              'window.addEventListener("pagehide"',
              'window.addEventListener("pageshow"',
              "clearAccountSessionMemory",
          ):
              if marker not in account_js:
                  raise SystemExit("account browser-session isolation missing: " + marker)

          forbidden = [
              "sb_secret_",
              "service_role",
              "SUPABASE_SERVICE_ROLE_KEY",
              "DEEPSEEK_API_KEY",
              "ZHIPUAI_API_KEY",
              "GLM_API_KEY",
              "OPENAI_API_KEY",
              "BEGIN PRIVATE KEY",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit("forbidden public secret marker: " + token)

          if "localStorage" in app:
              raise SystemExit("admin JWT must not persist in localStorage")
          if "mz_ai_admin_token" in app:
              raise SystemExit("admin bearer token must remain memory-only")
          if 'let token=""' not in app:
              raise SystemExit("memory-only admin access token contract missing")

          # Admin refresh continuity is tab-scoped only. Access JWTs stay memory-only;
          # the rotating refresh token may live in sessionStorage for at most 8 hours.
          for marker in (
              'const OPS_REFRESH_STORAGE_KEY="mz_ops_refresh_token"',
              'const OPS_SESSION_STARTED_STORAGE_KEY="mz_ops_session_started_at"',
              'const OPS_SESSION_MAX_AGE_MS=8*60*60*1000',
              'grant_type=refresh_token',
              'persistOperationsRefreshToken',
              'refreshAccessTokenFromStoredSession',
              'clearOperationsSessionStorage',
              'sessionStorage.setItem(OPS_REFRESH_STORAGE_KEY,refreshToken)',
              'sessionStorage.removeItem(OPS_REFRESH_STORAGE_KEY)',
              '/auth/v1/logout',
              'keepalive:true',
          ):
              if marker not in app:
                  raise SystemExit("tab-scoped admin refresh contract missing: " + marker)

          for forbidden_admin_persistence in (
              'sessionStorage.setItem("access_token"',
              'sessionStorage.setItem("token"',
              'sessionStorage.setItem("mz_ai_admin_token"',
              'sessionStorage.setItem("mz_ops_access',
              'sessionStorage.setItem(OPS_REFRESH_STORAGE_KEY,token)',
          ):
              if forbidden_admin_persistence in app:
                  raise SystemExit("admin access token persistence boundary violated: " + forbidden_admin_persistence)

          pagehide_start = app.index('window.addEventListener("pagehide"')
          pagehide_end = app.index('window.addEventListener("pageshow"', pagehide_start)
          pagehide_block = app[pagehide_start:pagehide_end]
          if "clearSensitiveBrowserState" not in pagehide_block:
              raise SystemExit("pagehide must clear memory-only admin access state")
          if "clearOperationsSessionStorage" in pagehide_block:
              raise SystemExit("pagehide must preserve tab-scoped refresh continuity across reloads")

          logout_start = app.index("function logout(){")
          logout_end = app.index('document.querySelectorAll("[data-preset]")', logout_start)
          logout_block = app[logout_start:logout_end]
          for marker in ("clearOperationsSessionStorage()", '/auth/v1/logout'):
              if marker not in logout_block:
                  raise SystemExit("admin logout must revoke and clear tab session: " + marker)

          for marker in (
              "window.opener !== null",
              'window.addEventListener("pagehide"',
              'window.addEventListener("pageshow"',
              "clearSensitiveBrowserState",
          ):
              if marker not in app:
                  raise SystemExit("admin browser-session isolation missing: " + marker)
          if app.index('history.replaceState(null,"",window.location.pathname+window.location.search)') < app.index("return true;", app.index("function consumePasswordSetupCallback")):
              pass
          else:
              raise SystemExit("admin callback token must be removed from URL before callback returns")
          if 'autocomplete="new-password"' not in text:
              raise SystemExit("provider key browser-autofill hardening missing")
          if "Content-Security-Policy" not in text:
              raise SystemExit("CSP missing")
          if "ftcyyvyoowkctbupzkct.supabase.co" not in text:
              raise SystemExit("backend endpoint missing")

          suspicious = re.findall(r'(?i)(?:sk-|sk_proj_|AIza)[A-Za-z0-9_\-]{16,}', text)
          if suspicious:
              raise SystemExit("possible secret-shaped value detected")

          print("PUBLIC_FRONTEND_SECURITY_GATE=PASS")
          PY
      - name: Verify JavaScript syntax
        run: |
          set -euo pipefail
          node --check entry.js
          node --check account.js
          node --check app.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("studyroom.html").read_text(encoding="utf-8")
          match = re.search(r"(?s)<script>(.*?)</script>", html)
          if not match:
              raise SystemExit("studyroom inline script missing")
          Path("/tmp/studyroom-inline.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/studyroom-inline.js
