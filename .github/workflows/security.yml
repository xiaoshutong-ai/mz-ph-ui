               assert(!workspace.includes(marker),"Workspace still embeds StudyRoom board: "+marker);
             assert(!workspace.includes('class="agent-personal-cols"'));
           });
           test("main Character Contract and Muse transport remain intact",async()=>{for(const s of ["Character Contract v1","主对话 · 原话直通","旁聊天 · SOUL/Memory","muse_transport:transport"])assert(studyroom.includes(s),s);assert(workflow.includes("StudyRoom Muse transport controls missing"));});
           for(const [name,fn] of tests){try{await fn();results.push({name,status:"PASS"});}catch(e){results.push({name,status:"FAIL",message:e.message});}}
           return results;
