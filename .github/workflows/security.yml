name: Public Frontend Security Gate

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, mz-ph-ui]
    timeout-minutes: 5
    steps:
      - name: Admit organization-member pull requests only
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Pre-roster compatibility marker consumed by the immediately previous base gate: xst-xia|EmilioJI)
          case "$PR_AUTHOR_ASSOCIATION" in
            MEMBER|OWNER)
              echo "ORGANIZATION_MEMBER_PR=PASS"
              ;;
            *)
              case "$PR_AUTHOR_LOGIN" in
                EmilioJI|xst-bi|xst-juan|xst-mo|xst-xia|xst-yan|xst-zhi)
                  echo "TRUSTED_MAINTAINER_PR=PASS"
                  ;;
                *)
                  echo "::error::External pull requests are not accepted by policy (author=$PR_AUTHOR_LOGIN, association=$PR_AUTHOR_ASSOCIATION)."
                  exit 1
                  ;;
              esac
              ;;
          esac

      - name: Checkout main push
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout PR candidate read-only
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify public frontend boundary
        shell: bash
        env:
          GH_RELEASE_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          def fetch_github_json(api_url, unavailable_message):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "mz-ph-ui-public-security-gate",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              token = os.environ.get("GH_RELEASE_READ_TOKEN", "").strip()
              if not token:
                  raise SystemExit("trusted GitHub Release read token is unavailable")
              headers["Authorization"] = "Bearer " + token
              last_error = None
              for attempt in range(3):
                  request = urllib.request.Request(api_url, headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=10) as response:
                          import json as _json
                          return _json.load(response)
                  except urllib.error.HTTPError as error:
                      last_error = error
                      if error.code not in {429, 500, 502, 503, 504}:
                          break
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                      last_error = error
                  if attempt < 2:
                      time.sleep(1 + attempt)
              raise SystemExit(unavailable_message) from last_error

          files = [Path("index.html"), Path("workspace.html"), Path("account.html"), Path("style.css"), Path("entry.js"), Path("account.js"), Path("app.js"), Path("board-consumer.js"), Path("README.md"), Path("SECURITY.md")]
          text = "\n".join(p.read_text(encoding="utf-8") for p in files if p.exists())
          root = Path("index.html").read_text(encoding="utf-8")
          workspace = Path("workspace.html").read_text(encoding="utf-8")
          account = Path("account.html").read_text(encoding="utf-8")
          entry_js = Path("entry.js").read_text(encoding="utf-8")
          account_js = Path("account.js").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          studyroom = Path("studyroom.html").read_text(encoding="utf-8")
          board_consumer = Path("board-consumer.js").read_text(encoding="utf-8")
          style = Path("style.css").read_text(encoding="utf-8")
          studyroom_board_style_path = Path("studyroom-board.css")
          studyroom_board_style = (
              studyroom_board_style_path.read_text(encoding="utf-8")
              if studyroom_board_style_path.exists() else ""
          )

          # StudyRoom board visual systems stay token-driven. During the v3→v4
          # rollout the trusted base gate accepts exactly either approved protocol,
          # then applies the same raw-color boundary to the active implementation.
          v3_marker = "/* ===== 水墨书院实时看板 v3 · 中文视觉系统 ===== */"
          v4_marker = "/* ===== 水墨书院实时看板 v4 · Calm Control Surface ===== */"
          embedded_visual_markers = sum(marker in style for marker in (v3_marker, v4_marker))
          separate_visual_markers = sum(marker in studyroom_board_style for marker in (v3_marker, v4_marker))
          if studyroom_board_style:
              if embedded_visual_markers:
                  raise SystemExit("StudyRoom visual system must not be duplicated across shared and project CSS")
              if separate_visual_markers != 1:
                  raise SystemExit("separate StudyRoom CSS must contain exactly one approved visual-system marker")
              if '<link rel="stylesheet" href="studyroom-board.css">' not in studyroom:
                  raise SystemExit("StudyRoom page must load its project-owned board stylesheet")
              board_style = studyroom_board_style
          else:
              if embedded_visual_markers != 1:
                  raise SystemExit("embedded StudyRoom CSS must contain exactly one approved visual-system marker")
              board_style = style
          v3_start = board_style.find(v3_marker)
          v4_start = board_style.find(v4_marker)
          if (v3_start >= 0) == (v4_start >= 0):
              raise SystemExit("StudyRoom must contain exactly one approved visual-system marker")
          board_version = "v4" if v4_start >= 0 else "v3"
          visual_start = v4_start if board_version == "v4" else v3_start
          token_start = board_style.find("#srAgents{", visual_start)
          token_end = board_style.find("\n}", token_start)
          if token_start < 0 or token_end <= token_start:
              raise SystemExit("StudyRoom visual token boundary missing")
          token_block = board_style[token_start:token_end]
          for token in (
              "--sr-text:", "--sr-surface:", "--sr-border:", "--sr-jade:",
              "--sr-danger:", "--sr-wait:", "--sr-decision:", "--sr-done:",
              "--sr-seat-bi:", "--sr-seat-mo:", "--sr-seat-zhi:",
              "--sr-seat-yan:", "--sr-seat-juan:", "--sr-seat-xia:",
              "--sr-shadow:", "--sr-focus:",
          ):
              if token not in token_block:
                  raise SystemExit("StudyRoom semantic visual token missing: " + token)
          component_rules = board_style[token_end + 2:]
          raw_component_colors = re.findall(
              r"#[0-9A-Fa-f]{3,8}\b|rgba?\([^)]*\)",
              component_rules,
          )
          if raw_component_colors:
              raise SystemExit(
                  "StudyRoom component rules must consume semantic tokens; raw colors found: "
                  + ", ".join(sorted(set(raw_component_colors)))
              )

          # Water-Ink Academy board is Chinese-first at the presentation layer.
          board_start = studyroom.find('<div id="srAgents"')
          board_end = studyroom.find('<script src="./board-consumer.js"', board_start)
          if board_start < 0 or board_end <= board_start:
              raise SystemExit("StudyRoom board presentation boundary missing")
          board_surface = studyroom[board_start:board_end]
          if 'style="' in board_surface:
              raise SystemExit("StudyRoom board must use shared CSS classes, not inline style attributes")

          board_required_copy_v3 = (
              "院务态势 · 实时",
              "六席实时看板",
              "先看全院，再看个人",
              "全院态势",
              "当前主任务",
              "个人态势",
              "查看个人看板",
              "查看完整信息",
              "任务编号",
              "范围与验收",
              "负责人 / 实施 / 复核",
              "当前阶段",
              "验证证据",
              "下一步",
              "阻塞原因",
          )
          board_required_copy_v4 = (
              "院务态势",
              "六席运行态势",
              "状态讲事实，观察讲可见性",
              "全院概览",
              "最近可见",
              "最近事项",
              "个人看板",
              "席位详情",
              "状态摘要",
              "状态来源",
          )
          board_source = board_surface + "\n" + board_consumer
          board_required_copy = board_required_copy_v4 if board_version == "v4" else board_required_copy_v3
          for marker in board_required_copy:
              if marker not in board_source:
                  raise SystemExit("Chinese-first board copy missing: " + marker)
          if board_version == "v4":
              for marker in ("function controlDetailSnapshot(detail)", "compactControlText", "relativeControlTime"):
                  if marker not in board_consumer:
                      raise SystemExit("StudyRoom v4 renderer contract missing: " + marker)

          board_forbidden_visible_copy = (
              "UNAVAILABLE ·",
              "PARTIAL ·",
              "STALE ·",
              "个人页 →",
              '"task_id"',
              '"Goal"',
              '"owner / writer / reviewer"',
              '"stage / activity"',
              '"next action"',
              '"dependencies"',
          )
          for marker in board_forbidden_visible_copy:
              if marker in board_source:
                  raise SystemExit("mixed-language board UI regressed: " + marker)

          if "renderAgentStatusOps = function" in board_consumer or "agentPersonalEntryState" in board_consumer:
              raise SystemExit("StudyRoom board renderer must remain presentation-only and not rebind workspace UI")


          # Whole-repository public-boundary audit. This intentionally scans tracked
          # source, not only the Pages files, because the GitHub repository itself is public.
          tracked = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              rel = path.as_posix().removeprefix("./")
              if rel.startswith("_site/"):
                  continue
              if path.is_symlink():
                  raise SystemExit("tracked symlink forbidden in public repository: " + rel)
              if path.stat().st_size > 1_000_000:
                  raise SystemExit("tracked file exceeds 1 MB public-repo limit: " + rel)
              tracked.append((rel, path))

          character_assets = {
              "assets/characters/bi.png": "a9dba9b4714f3fdcd2005c805cc4a389f7d0387f",
              "assets/characters/mo.png": "6a383eaf342d46dcbad7daf0dc70508fee280318",
              "assets/characters/zhi.png": "1ae56784b32d50ce9efbdfded0e9c315c886111a",
              "assets/characters/yan.png": "1346f38b0e4449f4fe0e43f9f8081fffd11ae523",
              "assets/characters/juan.png": "4bc232cbfb237baed8a96c0fb14607930f4557b4",
              "assets/characters/xia.png": "4039caeacf3e449e412b95f0422af39d137350b8",
          }
          allowed_exact = {
              ".nojekyll",
              "README.md",
              "SECURITY.md",
              "AGENTS.md", "studyroom.html", "studyroom-board.css", "PUBLIC_ARTIFACT_PROVENANCE.json",
              "index.html",
              "workspace.html",
              "account.html",
              "style.css",
              "entry.js",
              "account.js",
              "app.js",
              ".github/workflows/pages.yml",
              ".github/workflows/security.yml", "status-public.js", "devices.html", "board-consumer.js",
          } | set(character_assets)
          allowed_prefixes = (
              "updates/",
          )
          for rel, _path in tracked:
              if rel in allowed_exact or any(rel.startswith(prefix) for prefix in allowed_prefixes):
                  continue
              raise SystemExit("unexpected tracked path in public repository: " + rel)

          if any(rel.startswith("supabase/") for rel, _path in tracked):
              raise SystemExit("server-side Supabase source is forbidden in public repository")

          # Project-specific public files are mirrors/generated artifacts only.
          import json as _provenance_json
          provenance_path = Path("PUBLIC_ARTIFACT_PROVENANCE.json")
          if not provenance_path.exists():
              raise SystemExit("public artifact provenance manifest is required")
          provenance = _provenance_json.loads(provenance_path.read_text(encoding="utf-8"))
          schema_version = provenance.get("schema_version")
          if schema_version not in {1, 2, 3} or provenance.get("policy") != "project-facts-follow-project":
              raise SystemExit("public artifact provenance identity mismatch")
          artifacts = provenance.get("artifacts")
          if not isinstance(artifacts, list) or len(artifacts) < 2:
              raise SystemExit("public artifact provenance must declare project-owned mirrors")
          expected_provenance = {
              ("xiaoshutong-ai/xiaoshutong-shuyuan", "ops/public-web"): {
                  "studyroom.html", "board-consumer.js"
              },
              ("xiaoshutong-ai/xiaoshutong-fuzipartner", "ops/public-distribution"): {
                  "updates/fuzi/latest.json", "updates/fuzi/v2/policy.json"
              },
          }
          target_expected_provenance_v2 = {
              ("xiaoshutong-ai/xiaoshutong-shuyuan", "ops/public-web"): {
                  "studyroom.html", "board-consumer.js", "devices.html",
                  "assets/characters/bi.png", "assets/characters/mo.png", "assets/characters/zhi.png",
                  "assets/characters/yan.png", "assets/characters/juan.png", "assets/characters/xia.png"
              },
              ("xiaoshutong-ai/xiaoshutong-fuzipartner", "ops/public-distribution"): {
                  "updates/fuzi/latest.json", "updates/fuzi/v2/policy.json"
              },
              ("xiaoshutong-ai/xiaoshutong-Mengzheng", "ops/public-web"): {
                  "index.html", "account.html", "account.js"
              },
          }
          target_expected_provenance_v3 = {
              ("xiaoshutong-ai/xiaoshutong-shuyuan", "ops/public-web"): {
                  "studyroom.html", "board-consumer.js", "devices.html", "studyroom-board.css",
                  "assets/characters/bi.png", "assets/characters/mo.png", "assets/characters/zhi.png",
                  "assets/characters/yan.png", "assets/characters/juan.png", "assets/characters/xia.png"
              },
              ("xiaoshutong-ai/xiaoshutong-fuzipartner", "ops/public-distribution"): {
                  "updates/fuzi/latest.json", "updates/fuzi/v2/policy.json"
              },
              ("xiaoshutong-ai/xiaoshutong-Mengzheng", "ops/public-web"): {
                  "index.html", "account.html", "account.js"
              },
          }
          allowed_provenance = {1: expected_provenance, 2: target_expected_provenance_v2, 3: target_expected_provenance_v3}[schema_version]
          seen_provenance = {}
          for item in artifacts:
              if not isinstance(item, dict):
                  raise SystemExit("public artifact provenance entry must be an object")
              key = (item.get("canonical_repository"), item.get("canonical_root"))
              paths = item.get("public_paths")
              if key not in allowed_provenance or not isinstance(paths, list):
                  raise SystemExit("unapproved public artifact provenance owner")
              seen_provenance[key] = set(paths)
              if item.get("publication_mode") not in {"mirror", "generated"}:
                  raise SystemExit("public artifact provenance publication mode invalid")
          if schema_version == 1:
              if seen_provenance != expected_provenance:
                  raise SystemExit("legacy public artifact provenance paths drifted")
              if provenance.get("mixed_files") not in (None, []):
                  raise SystemExit("legacy provenance may not declare mixed files")
          elif schema_version == 2:
              if seen_provenance != target_expected_provenance_v2:
                  raise SystemExit("v2 public artifact provenance paths drifted")
              mixed_files = provenance.get("mixed_files")
              if not isinstance(mixed_files, list):
                  raise SystemExit("v2 provenance mixed_files must be a list")
              if {item.get("path") for item in mixed_files if isinstance(item, dict)} != {"app.js", "workspace.html", "style.css"}:
                  raise SystemExit("v2 mixed-file provenance paths drifted")
          else:
              if seen_provenance != target_expected_provenance_v3:
                  raise SystemExit("v3 public artifact provenance paths drifted")
              mixed_files = provenance.get("mixed_files")
              if not isinstance(mixed_files, list):
                  raise SystemExit("v3 provenance mixed_files must be a list")
              if {item.get("path") for item in mixed_files if isinstance(item, dict)} != {"app.js", "workspace.html"}:
                  raise SystemExit("v3 mixed-file provenance paths drifted")

              expected_fragment_owners = {
                  ("app.js", "xiaoshutong-ai/xiaoshutong-shuyuan", "ops/public-web"): {
                      "ops/public-web/app-agent-status.fragment.js",
                      "ops/public-web/app-runtime-specs.fragment.js",
                      "ops/public-web/app-model-profiles.fragment.js",
                      "ops/public-web/app-runtime-validation.fragment.js",
                      "ops/public-web/app-runtime-presets.fragment.js",
                      "ops/public-web/app-runtime-consumer.fragment.js",
                  },
                  ("app.js", "xiaoshutong-ai/xiaoshutong-Mengzheng", "ops/public-web"): {
                      "ops/public-web/app-provider-jev.fragment.js",
                      "ops/public-web/app-entitlements-config.fragment.js",
                  },
                  ("workspace.html", "xiaoshutong-ai/xiaoshutong-Mengzheng", "ops/public-web"): {
                      "ops/public-web/workspace-project-panels.html",
                  },
              }
              target_fragment_owners = {
                  **expected_fragment_owners,
                  ("app.js", "xiaoshutong-ai/jev-chat-jarvis", "ops/public-web"): {
                      "ops/public-web/app-runtime-specs.fragment.js",
                      "ops/public-web/app-runtime-router.fragment.js",
                      "ops/public-web/app-runtime-description.fragment.js",
                      "ops/public-web/app-runtime-group-key.fragment.js",
                      "ops/public-web/app-runtime-group-meta.fragment.js",
                  },
              }
              fragment_owners = provenance.get("fragment_owners")
              if not isinstance(fragment_owners, list):
                  raise SystemExit("v3 provenance fragment_owners must be a list")
              seen_fragment_owners = {}
              for item in fragment_owners:
                  if not isinstance(item, dict):
                      raise SystemExit("fragment owner entry must be an object")
                  key = (
                      item.get("public_path"),
                      item.get("canonical_repository"),
                      item.get("canonical_root"),
                  )
                  paths = item.get("canonical_paths")
                  if key not in target_fragment_owners or not isinstance(paths, list):
                      raise SystemExit("unapproved project fragment owner")
                  if set(paths) != target_fragment_owners[key]:
                      raise SystemExit("project fragment canonical paths drifted")
                  if item.get("projection_mode") != "embedded-fragment":
                      raise SystemExit("project fragment projection mode must remain embedded-fragment")
                  if item.get("mirror_contract") != ".github/workflows/public-mirror-contract.yml":
                      raise SystemExit("project fragment mirror contract path drifted")
                  seen_fragment_owners[key] = set(paths)
              if seen_fragment_owners not in (expected_fragment_owners, target_fragment_owners):
                  raise SystemExit("project fragment ownership map drifted")

              mixed_by_path = {
                  item.get("path"): item for item in mixed_files if isinstance(item, dict)
              }
              app_project_contributors = set(
                  mixed_by_path.get("app.js", {}).get("project_contributors", [])
              )
              if app_project_contributors not in (
                  {
                      "xiaoshutong-ai/xiaoshutong-Mengzheng",
                      "xiaoshutong-ai/xiaoshutong-shuyuan",
                  },
                  {
                      "xiaoshutong-ai/jev-chat-jarvis",
                      "xiaoshutong-ai/xiaoshutong-Mengzheng",
                      "xiaoshutong-ai/xiaoshutong-shuyuan",
                  },
              ):
                  raise SystemExit("app.js project contributor boundary drifted")
              if set(mixed_by_path.get("workspace.html", {}).get("project_contributors", [])) != {
                  "xiaoshutong-ai/xiaoshutong-Mengzheng",
              }:
                  raise SystemExit("workspace.html project contributor boundary drifted")

          repo_text_parts = []
          for rel, path in tracked:
              if rel in character_assets:
                  data = path.read_bytes()
                  if not data.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise SystemExit("approved character asset is not PNG: " + rel)
                  git_blob = hashlib.sha1(
                      b"blob " + str(len(data)).encode("ascii") + b"\0" + data
                  ).hexdigest()
                  if git_blob != character_assets[rel]:
                      raise SystemExit("StudyRoom character asset drifted from approved App source: " + rel)
                  continue
              try:
                  value = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  raise SystemExit("binary tracked file forbidden in public repository: " + rel)
              repo_text_parts.append(value)
          repo_text = "\n".join(repo_text_parts)

          secret_patterns = {
              "private-key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              "supabase-secret": r"\bsb_secret_[A-Za-z0-9._-]{12,}",
              "openai-like": r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}",
              "google-api": r"\bAIza[A-Za-z0-9_-]{20,}",
              "aws-access-key": r"\bAKIA[0-9A-Z]{16}\b",
              "jwt": r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b",
          }
          for label, pattern in secret_patterns.items():
              if re.search(pattern, repo_text):
                  raise SystemExit("secret-shaped value found in public repository: " + label)

          security_workflow = Path(".github/workflows/security.yml").read_text(encoding="utf-8")
          if "pull_request_target:" not in security_workflow:
              raise SystemExit("security workflow must use trusted pull_request_target")
          if "\n  pull_request:\n" in security_workflow:
              raise SystemExit("untrusted pull_request trigger is forbidden for security gate")
          persist_marker = "persist-credentials:" + " false"
          if sum(line.strip() == persist_marker for line in security_workflow.splitlines()) != 2:
              raise SystemExit("both security checkouts must disable credential persistence")
          if "permissions:\n  contents: read" not in security_workflow:
              raise SystemExit("security workflow permissions must remain read-only")
          expected_runner = 'runs-on: [self-hosted, Linux, X64, mz-ph-ui]'
          if expected_runner not in security_workflow:
              raise SystemExit('security workflow must stay on the dedicated mz-ph-ui self-hosted Linux runner')
          member_gate_markers = (
              "Admit organization-member pull requests only",
              "PR_AUTHOR_ASSOCIATION:",
              "PR_AUTHOR_LOGIN:",
              "MEMBER|OWNER)",
              "EmilioJI|xst-bi|xst-juan|xst-mo|xst-xia|xst-yan|xst-zhi)",
              "External pull requests are not accepted by policy",
          )
          for marker in member_gate_markers:
              if marker not in security_workflow:
                  raise SystemExit("organization-member PR admission gate missing: " + marker)
          security_uses = {
              line.strip() for line in security_workflow.splitlines()
              if line.strip().startswith("uses:")
          }
          expected_security_uses = {
              "uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
          }
          if security_uses != expected_security_uses:
              raise SystemExit("security workflow actions must stay pinned to the approved SHA")
          trusted_release_token_marker = "GH_RELEASE_READ_TOKEN: $" + "{{ github" + ".token }}"
          if security_workflow.count(trusted_release_token_marker) != 1:
              raise SystemExit("trusted Release metadata token must be step-scoped exactly once")
          security_workflow_for_privileged_scan = security_workflow.replace(trusted_release_token_marker, "")
          privileged_markers = (
              "secrets" + ".",
              "github" + ".token",
              "toJson" + "(github)",
              "toJSON" + "(github)",
          )
          for forbidden in privileged_markers:
              if forbidden in security_workflow_for_privileged_scan:
                  raise SystemExit("security workflow may not expose privileged GitHub context: " + forbidden)

          pages = Path(".github/workflows/pages.yml").read_text(encoding="utf-8")
          pages_uses = {
              line.strip() for line in pages.splitlines()
              if line.strip().startswith("uses:")
          }
          expected_pages_uses = {
              "uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
              "uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5",
              "uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4",
              "uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4",
          }
          if pages_uses != expected_pages_uses:
              raise SystemExit("Pages workflow actions must stay pinned to approved SHAs")
          if pages.count("run: |") != 1:
