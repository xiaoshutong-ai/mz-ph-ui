          node <<'NODE'
          const assert=require('node:assert/strict');
          const Board=require('./board-consumer.js');
          const now=Date.now();
          const detail=JSON.stringify({
            schema:'xia-team-board/v1',
            inventory_state:'partial',
            tasks:[
              {id:'demo-main',sec:'doing',main:true,title:'中文版视觉重构',status:'in_progress',scope:'中文优先、状态可视化',owr:'匣 / 匣 / 笔',stage:'final_review',evidence:'正式 Gate PASS',priority:'high',next:'完成独立复核',checked:new Date(now).toISOString()},
              {id:'demo-blocked',sec:'blocked',title:'等待产品决定',status:'blocked',blocker:'等待确认',checked:new Date(now).toISOString()}
            ],
            checked_at:new Date(now).toISOString(),
            source:'governance#9'
          });
          const rows=[
            {id:'bi',status:'in_progress',task_name:'demo',task_detail:detail,updated_at:new Date(now).toISOString()},
            {id:'mo',status:'idle',task_name:'none',task_detail:JSON.stringify({schema:'xia-team-board/v1',inventory_state:'confirmed_empty',tasks:[],checked_at:new Date(now).toISOString()}),updated_at:new Date(now).toISOString()}
          ];
          const names={bi:'笔',mo:'墨',zhi:'纸',yan:'砚',juan:'卷',xia:'匣'};
          const html=Board.renderOverview(rows,names,'水墨书院 · 当前六席上报',now)
            + Board.renderPersonal('bi','笔',rows[0],now);
          for(const marker of ['全院态势','当前主任务','个人态势','查看个人看板','查看完整信息','任务编号','范围与验收','负责人 / 实施 / 复核','当前阶段','验证证据','下一步','阻塞原因','进行中','受阻']){
            assert.ok(html.includes(marker),'Chinese render marker missing: '+marker);
          }
          for(const marker of ['UNAVAILABLE ·','PARTIAL ·','STALE ·','task_id','owner / writer / reviewer','stage / activity','next action','dependencies','>in_progress<','>final_review<','>high<']){
            assert.ok(!html.includes(marker),'mixed-language render leaked: '+marker);
          }
          assert.ok(html.includes('最终复核'),'stage token not localized');
          assert.ok(html.includes('优先级 · 高'),'priority token not localized');
          assert.ok(html.includes('aria-label="查看笔的个人看板"'),'seat action accessibility label missing');
          for(const id of ['bi','mo','zhi','yan','juan','xia']){
            assert.ok(
              html.includes('src="./assets/characters/'+id+'.png"'),
              'official StudyRoom avatar missing from renderer: '+id
            );
          }
          const escaped=Board.renderPersonal('bi','笔',{...rows[0],task_detail:JSON.stringify({schema:'xia-team-board/v1',tasks:[{id:'x',sec:'doing',title:'<img src=x onerror=attack>',status:'in_progress'}]})},now);
          assert.ok(!escaped.includes('<img src=x'),'task title escaping regressed');
          assert.ok(escaped.includes('&lt;img'),'escaped task title missing');
          console.log('BOARD_CHINESE_RENDER=PASS');
          NODE
      - name: Verify bounded agent-control v2 board contracts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Only trusted main executes production source. pull_request_target remains static-only.
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          const app=fs.readFileSync("app.js","utf8");
          const room=fs.readFileSync("studyroom.html","utf8");
          const pub=fs.readFileSync("status-public.js","utf8");
          const imported=await import("./board-consumer.js");
          const B=imported.default?.renderControlOverview?imported.default:(globalThis.BoardConsumer||imported);
          const N={bi:"笔",mo:"墨",zhi:"纸",yan:"砚",juan:"卷",xia:"匣"};
          const now="2026-10-05T04:00:00.000Z";
          const row=(id,o={})=>({agent_id:id,display_name:N[id],adapter_type:id==="xia"?"dot":"muse",
            refresh_mode:id==="xia"?"legacy_passive":"active",activity_state:"idle",freshness:"fresh",
            observer_freshness:"fresh",current_task_title:null,current_task_detail:null,current_progress:null,
            last_task_title:"SYNTHETIC_"+id,last_task_detail:"done",last_blocker:null,last_report_at:now,
            last_observed_at:now,report_source:id==="xia"?"legacy-github":"xstpilot",revision:1,...o});
          const rows=Object.keys(N).map(id=>row(id));

          const valid=B.validateControlRows(rows,N);
          assert.equal(valid.length,6);
          assert.equal(valid.at(-1).refresh_mode,"legacy_passive");
          assert.throws(()=>B.validateControlRows([...rows,row("bi")],N));
          assert.throws(()=>B.validateControlRows([{...row("bi"),current_progress:101}],N));

          const overview=B.renderControlOverview(
            B.validateControlRows(rows.map(r=>r.agent_id==="mo"?{...r,freshness:"stale"}:r),N),N,"fixture"
          );
          assert.match(overview,/状态新鲜/);
          assert.match(overview,/(观察器在线|最近可见)/);
          assert.match(overview,/状态陈旧/);

          const style=fs.readFileSync("style.css","utf8");
          const boardV4=style.includes("水墨书院实时看板 v4 · Calm Control Surface");
          if(boardV4){
            const xiaDetail=JSON.stringify({
              schema:"xia-team-board/v1",
              inventory_state:"partial",
              tasks:[{
                id:"team-board-v2",sec:"done",title:"总实时看板+个人实时看板",
                status:"LANDED",result:"六席生产数据持续可读",
                next:"继续观察自动 heartbeat freshness",main:true
              }],
              checked_at:"2026-10-04T17:16:15Z",source:"governance#9"
            });
            const xia=B.validateControlRows([row("xia",{
              activity_state:"unknown",freshness:"stale",observer_freshness:"fresh",
              last_task_title:"已上报：已完成 1",last_task_detail:xiaDetail
            })],N)[0];
            const xiaHtml=B.renderControlOverview([xia],{xia:"匣"},"fixture")
              +B.renderControlPersonal("xia","匣",xia,Date.parse(now));
            assert.match(xiaHtml,/总实时看板\+个人实时看板/);
            assert.match(xiaHtml,/六席生产数据持续可读/);
            assert.doesNotMatch(xiaHtml,/xia-team-board\/v1/);
            assert.doesNotMatch(xiaHtml,/"schema"/);
          }

          let personal=B.renderControlPersonal("bi","笔",valid[0],Date.parse(now));
          assert.match(personal,/LAST/);
          assert.doesNotMatch(personal,/CURRENT/);
          const busy=B.validateControlRows([row("mo",{activity_state:"busy",current_task_title:"CURRENT_JOB",current_progress:42})],N)[0];
          personal=B.renderControlPersonal("mo","墨",busy,Date.parse(now));
          assert.match(personal,/CURRENT_JOB/);
          assert.match(personal,/42%/);
          const escaped=B.renderControlPersonal("bi","笔",
            B.validateControlRows([row("bi",{activity_state:"busy",current_task_title:"<img onerror=x>",current_task_detail:"<script>x</script>"})],N)[0],
            Date.parse(now));
          assert.match(escaped,/&lt;img onerror=x&gt;/);
          assert.ok(escaped.includes("&lt;script&gt;x&lt;/script&gt;"));
          assert.doesNotMatch(escaped,/<h4><img/);
          assert.doesNotMatch(escaped,/<p><script>/);

          assert.match(app,/AGENT_CONTROL_V2_PATH="\/functions\/v1\/studyroom-agent-control"/);
          assert.match(app,/runAgentStatusRequest\("state"\)/);
          assert.match(app,/runAgentStatusRequest\("refresh"\)/);
          assert.match(app,/AGENT_OPS_FOLLOWUP_LIMIT=6/);
          assert.doesNotMatch(app,/\/rest\/v1\/agent_status\?select=/);
          const appFollow=app.slice(app.indexOf("function agentOpsStartFollowup"),app.indexOf("function agentOpsErrorMessage"));
          assert.match(appFollow,/loadAgentStatusOps\(\)/);
          assert.doesNotMatch(appFollow,/refreshAgentStatusOps\(\)/);

          assert.match(room,/SR_AGENT_CONTROL_PATH="\/functions\/v1\/studyroom-agent-control"/);
          assert.match(room,/BoardConsumer\.validateControlRows/);
          assert.match(room,/BoardConsumer\.renderControlOverview/);
          assert.match(room,/SR_AGENT_FOLLOWUP_LIMIT=6/);
          assert.doesNotMatch(room,/\/rest\/v1\/agent_status\?select=/);
          const all=room.slice(room.indexOf("function refreshAll(){"),room.indexOf("(function(){",room.indexOf("function refreshAll(){")));
          assert.match(all,/loadAgents\(\)/);
          assert.doesNotMatch(all,/refreshAgents\(\)/);
          const follow=room.slice(room.indexOf("function startSrAgentFollowup"),room.indexOf("async function loadAgents"));
          assert.match(follow,/loadAgents\(\)/);
          assert.doesNotMatch(follow,/refreshAgents\(\)/);

          assert.match(pub,/\/rest\/v1\/agent_status_public\?select=\*&order=id/);
          assert.doesNotMatch(pub,/studyroom-agent-control/);
          assert.doesNotMatch(pub,/method:\s*"POST"/);

          const scripts=[...room.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          assert.ok(scripts.length);
          for(const source of scripts)assert.doesNotThrow(()=>new Function(source));
          assert.equal(typeof B.renderOverview,"function");
          assert.equal(typeof B.renderPersonal,"function");
          console.log("AGENT_CONTROL_V2_WEB_CONTRACT=PASS");
          NODE
