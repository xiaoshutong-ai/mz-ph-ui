            const equal=(actual,expected,message)=>assert(actual===expected,message+": expected "+expected+", got "+actual);
            const test=async(name,callback)=>{try{await callback();results.push({name,status:"PASS"});}catch(error){results.push({name,status:"FAIL",message:error.message});}};
