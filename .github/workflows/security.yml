            assert(start>=0&&end>start&&enterStart>=0&&enterEnd>enterStart,"Actual production source boundaries missing");
            const boardSource=app.slice(start,end);
            function harness(){
              let now=1800000000000,timerId=0;
              const timers=new Map(),requests=[],queue=[],nodes=new Map();
              const node=id=>{
                if(!nodes.has(id)){
                  const classes=new Set(id==="agentPersonalBoard"?["hidden"]:[]);
                  nodes.set(id,{innerHTML:"",textContent:"",disabled:false,checked:false,
                    classList:{contains:value=>classes.has(value),add:value=>classes.add(value),remove:value=>classes.delete(value)}});
                }
                return nodes.get(id);
              };
              const document={hidden:false};
              class FakeDate extends Date{constructor(...args){super(...(args.length?args:[now]));}static now(){return now;}}
              const authApi=async(path,method)=>{requests.push({path,method});return queue.length?await queue.shift()():[];};
              const create=new Function("$","document","Date","authApi","setInterval","clearInterval","location",[
                'let token="test-session",selectedProjectKey="xiaoshutong",operationsProjectGeneration=0;const opsAuthStatus=null;',
                'function setAuthStage(stage){if(stage==="console")$("console").classList.remove("hidden");}',
                'async function loadSecuritySettings(){}async function applyProjectSelection(){}',
                boardSource,app.slice(enterStart,enterEnd),
                'return {read:loadAgentStatusOps,enter:enterOperationsHub,ensure:agentOpsEnsureTimers,visibility:agentOpsOnVisibilityChange,clear:clearAgentStatusOps,setToken:value=>{token=value;}};'
              ].join("\n"));
              const api=create(node,document,FakeDate,authApi,
                (callback,ms)=>{const id=++timerId;timers.set(id,{callback,ms,nextAt:now+ms});return id;},
                id=>timers.delete(id),{search:""});
              const flush=async()=>{for(let n=0;n<12;n++)await Promise.resolve();};
              return {api,node,document,timers,requests,queue,flush,advance:ms=>{now+=ms;},
                tick:async()=>{for(const timer of [...timers.values()])timer.callback();await flush();},
                hide:()=>{document.hidden=true;api.visibility();},
                show:async()=>{document.hidden=false;api.visibility();await flush();},
                elapse:async ms=>{
                  const target=now+ms;let iterations=0;
