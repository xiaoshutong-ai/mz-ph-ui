           function harness(){
            const nodes=new Map(),queue=[],requests=[],timers=new Map();let now=NOW,id=0;
            const node=k=>{if(!nodes.has(k)){const classes=new Set(["agentPersonalBoard","login"].includes(k)?["hidden"]:[]);nodes.set(k,{innerHTML:"",textContent:"",disabled:false,value:"",handlers:new Map(),addEventListener(t,f){this.handlers.set(t,f)},scrollIntoView(){},classList:{contains:k=>classes.has(k),add:k=>classes.add(k),remove:k=>classes.delete(k),toggle:(k,v)=>v?classes.add(k):classes.delete(k)}});}return nodes.get(k);};
            const storage=new Map(),sessionStorage={getItem:k=>storage.get(k)||null,setItem:(k,v)=>storage.set(k,String(v)),removeItem:k=>storage.delete(k)};
            const document={hidden:false,body:node("body")};class FakeDate extends Date{constructor(...a){super(...(a.length?a:[now]));}static now(){return now;}}
            const fetch=async(url,opts)=>{requests.push({url,method:opts.method,headers:opts.headers});return queue.length?await queue.shift()():response(200,rows());};
            const body=[
             'let token="FAKE_SESSION",operationsRefreshPromise=null,selectedProjectKey="xiaoshutong",operationsProjectGeneration=0;const BASE="https://fixture.invalid",PUB="public",FN=BASE;',
             'const OPS_REFRESH_STORAGE_KEY="mz_ops_refresh_token",OPS_SESSION_STARTED_STORAGE_KEY="mz_ops_session_started_at",OPS_SESSION_MAX_AGE_MS=28800000;',
             'let opsMemberships=[{project_key:"xiaoshutong",repository_full_name:"example/a"},{project_key:"mengzheng",repository_full_name:"example/b"}];function membershipFor(){return opsMemberships.find(p=>p.project_key===selectedProjectKey);}',
             section("function setAuthStage(stage){","function consumePasswordSetupCallback()"),
             'async function prepareMfa(){}async function bootstrapAuthenticatedSession(){}function clearSensitiveBrowserState(){clearAgentStatusOps();token="";}',
             section("let operationsSessionGeneration=","function qrDataUri("),
             section("async function api(","async function prepareMfa("),
             section("/* 六席状态","async function loadSecuritySettings()"),
             section('$("agentStatusOpsList")?.addEventListener(',"async function initializeOperationsSession()"),
             'return {read:loadAgentStatusOps,open:openAgentPersonalBoard,refresh:loadAgentPersonalBoard,close:closeAgentPersonalBoard,visibility:agentOpsOnVisibilityChange,clear:clearAgentStatusOps,switchProject(key){selectedProjectKey=key;syncAgentOpsProject();},newSession(){clearOperationsSessionStorage();token="NEW_FAKE";setAuthStage("console");},logout(){clearOperationsSessionStorage();token="";setAuthStage("login");},token:()=>token};'
            ].join("\n");
            const h=new Function("$","document","fetch","sessionStorage","Date","setInterval","clearInterval",body)(node,document,fetch,sessionStorage,FakeDate,(fn,ms)=>{timers.set(++id,{fn,ms});return id;},id=>timers.delete(id));
            const flush=async()=>{for(let i=0;i<30;i++)await Promise.resolve();};
            return {h,node,queue,requests,timers,document,flush,count:()=>requests.filter(r=>r.url.includes("/rest/v1/agent_status")).length,advance:ms=>now+=ms,tick:async()=>{for(const t of [...timers.values()])t.fn();await flush();}};
           }
           const html=x=>x.node("agentPersonal_current").innerHTML;
           const populated=async()=>{const x=harness();await x.h.read();await x.h.open("bi");await x.flush();return x;};
           test("personal uses current authenticated REST, never agent_board",async()=>{const x=harness();await x.h.open("bi");await x.flush();eq(x.count(),1);assert(!x.requests.some(r=>r.url.includes("agent_board")));assert(html(x).includes("SYNTHETIC_bi"));eq(x.requests[0].headers.Authorization,"Bearer FAKE_SESSION");});
           for(const id of names)test("seat "+id+" renders only its snapshot",async()=>{const x=await populated();await x.h.open(id);eq(x.count(),1);assert(html(x).includes("SYNTHETIC_"+id));for(const other of names.filter(n=>n!==id))assert(!html(x).includes("SYNTHETIC_"+other));});
           test("personal manual refresh updates total and detail once",async()=>{const x=await populated(),r=rows();r[0].task_name="CHANGED";x.queue.push(async()=>response(200,r));await x.h.refresh();eq(x.count(),2);assert(html(x).includes("CHANGED"));assert(x.node("agentStatusOpsList").innerHTML.includes("CHANGED"));});
           test("simultaneous total and personal clicks share one in-flight read",async()=>{const x=await populated(),d=deferred();x.queue.push(()=>d.promise);const p=x.h.read();await x.h.refresh();await x.h.refresh();eq(x.count(),2);d.resolve(response(200,rows()));await p;await x.flush();eq(x.count(),2);});
           test("exactly hourly shared fallback, no 30 second polling",async()=>{const x=await populated();x.advance(3599999);await x.tick();eq(x.count(),1);x.advance(1);await x.tick();eq(x.count(),2);await x.tick();eq(x.count(),2);assert(!/AGENT_OPS_TRACK_MS|agentOpsTrack30s/.test(app));});
           test("manual refresh resets the shared hourly deadline",async()=>{const x=await populated();x.advance(1800000);await x.h.refresh();x.advance(1800000);await x.tick();eq(x.count(),2);});
           test("hidden page sends no total or personal reads",async()=>{const x=await populated();x.document.hidden=true;x.h.visibility();await x.h.refresh();await x.h.read();x.advance(7200000);await x.tick();eq(x.count(),1);});
           test("fresh visibility return does not fetch",async()=>{const x=await populated();x.document.hidden=true;x.h.visibility();x.document.hidden=false;x.h.visibility();await x.flush();eq(x.count(),1);});
           test("hidden in-flight completion requires exactly one pending read",async()=>{const x=harness(),d=deferred();x.queue.push(()=>d.promise);const p=x.h.open("bi");x.document.hidden=true;x.h.visibility();d.resolve(response(200,rows()));await p;x.document.hidden=false;x.h.visibility();await x.flush();eq(x.count(),2);await x.tick();eq(x.count(),2);});
           test("HTTP 200 empty clears prior data and cannot claim success/no tasks",async()=>{const x=await populated();x.queue.push(async()=>response(200,[]));await x.h.refresh();assert(!html(x).includes("SYNTHETIC"));eq(x.node("agentStatusOpsList").innerHTML,"");assert(x.node("agentStatusOpsState").textContent.includes("UNAVAILABLE"));x.queue.push(async()=>response(200,[]));await x.h.open("bi");assert(!html(x).includes("SYNTHETIC"));});
           test("missing seat removes old detail without claiming no tasks",async()=>{const x=await populated();x.queue.push(async()=>response(200,rows().filter(r=>r.id!=="bi")));await x.h.refresh();assert(!html(x).includes("SYNTHETIC_bi"));assert(/未上报|未取得/.test(html(x)+x.node("agentPersonalState").textContent));assert(!html(x).includes("暂无任务"));});
           for(const mode of ["duplicate","unknown","malformed"])test("invalid rows "+mode+" fail closed",async()=>{const x=await populated(),r=rows();if(mode==="duplicate")r.push(r[0]);if(mode==="unknown")r[0].id="outside";if(mode==="malformed")r[0].task_name={private:"data"};x.queue.push(async()=>response(200,r));await x.h.refresh();assert(!html(x).includes("SYNTHETIC"));eq(x.node("agentStatusOpsList").innerHTML,"");assert(x.node("agentStatusOpsState").textContent.includes("UNAVAILABLE"));});
           test("other projects never request or reuse global status",async()=>{const x=await populated();x.h.switchProject("mengzheng");await x.h.open("bi");eq(x.count(),1);assert(!html(x).includes("SYNTHETIC"));assert(x.node("agentPersonalEntry").classList.contains("hidden"));});
           test("project switch rejects late response",async()=>{const x=harness(),d=deferred();x.queue.push(()=>d.promise);const p=x.h.open("bi");x.h.switchProject("mengzheng");d.resolve(response(200,rows()));await p;assert(!html(x).includes("SYNTHETIC"));eq(x.node("agentStatusOpsList").innerHTML,"");});
           test("seat switch during shared read renders only new seat",async()=>{const x=harness(),d=deferred();x.queue.push(()=>d.promise);const p=x.h.open("bi");await x.h.open("mo");d.resolve(response(200,rows()));await p;await x.flush();assert(html(x).includes("SYNTHETIC_mo"));assert(!html(x).includes("SYNTHETIC_bi"));eq(x.count(),1);});
           for(const status of [401,403])test("HTTP "+status+" clears snapshot and detail",async()=>{const x=await populated();x.queue.push(async()=>response(status,{}));await x.h.refresh();assert(!html(x).includes("SYNTHETIC"));eq(x.node("agentStatusOpsList").innerHTML,"");assert(x.node("agentPersonalBoard").classList.contains("hidden"));});
           test("new login cannot be repopulated by old response",async()=>{const x=harness(),d=deferred();x.queue.push(()=>d.promise);const p=x.h.open("bi");x.h.logout();x.h.newSession();const r=rows();r[0].task_name="NEW_SESSION";x.queue.push(async()=>response(200,r));await x.h.open("bi");d.resolve(response(200,rows()));await p;assert(html(x).includes("NEW_SESSION"));assert(!html(x).includes("SYNTHETIC_bi"));});
           for(const stamp of [new Date(NOW-3600000).toISOString(),"invalid",new Date(NOW+1000).toISOString()])test("source time stale "+stamp,async()=>{const x=harness(),r=rows();r[0].updated_at=stamp;x.queue.push(async()=>response(200,r));await x.h.open("bi");assert(x.node("agentPersonalState").textContent.includes("STALE"));assert(x.node("agentStatusOpsList").innerHTML.includes("STALE"));});
           test("snapshot text is escaped and never converted to approval/evidence",async()=>{const x=harness(),r=rows();r[0].task_name='<img src=x onerror="attack">';r[0].task_detail="<script>attack</script>";x.queue.push(async()=>response(200,r));await x.h.open("bi");assert(!html(x).includes("<img"));assert(!html(x).includes("<script>"));assert(html(x).includes("&lt;"));assert(!/APPROVED|head：|批准来源|核对证据/.test(html(x)));});
           test("same-session network error retains only stale snapshot",async()=>{const x=await populated();x.queue.push(async()=>{throw Error("offline")});await x.h.refresh();assert(html(x).includes("SYNTHETIC_bi"));assert(x.node("agentPersonalState").textContent.includes("STALE"));});
           test("StudyRoom owns the current-snapshot board without history/approval scope",async()=>{
             assert(!/agentPersonal_(approved_backlog|pending_decision|recent_completed|archived)/.test(studyroom));
