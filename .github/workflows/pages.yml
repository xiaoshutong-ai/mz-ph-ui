name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "workspace.html"
      - "account.html"
      - "studyroom.html"
      - "devices.html"
      - "style.css"
      - "entry.js"
      - "account.js"
      - "app.js"
      - "board-consumer.js"
      - "PUBLIC_ARTIFACT_PROVENANCE.json"
      - "assets/characters/**"
      - ".nojekyll"
      - "updates/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: [self-hosted, Linux, X64, mz-ph-ui]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build strict Pages allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -- index.html workspace.html account.html studyroom.html devices.html style.css entry.js account.js app.js PUBLIC_ARTIFACT_PROVENANCE.json .nojekyll _site/
          if [ -f board-consumer.js ]; then
            cp -- board-consumer.js _site/
          fi
          mkdir -p _site/assets/characters
          cp -- \
            assets/characters/bi.png \
            assets/characters/mo.png \
            assets/characters/zhi.png \
            assets/characters/yan.png \
            assets/characters/juan.png \
            assets/characters/xia.png \
            _site/assets/characters/
          if [ -d updates ]; then
            cp -R -- updates _site/
          fi

          python3 - <<'PY'
          from pathlib import Path

          root = Path("_site")
          allowed_root = {
              "index.html",
              "workspace.html",
              "account.html",
              "studyroom.html",
              "devices.html",
              "style.css",
              "entry.js",
              "account.js",
              "app.js",
              "board-consumer.js",
              "PUBLIC_ARTIFACT_PROVENANCE.json",
              ".nojekyll",
          }
          allowed_character_assets = {
              "assets/characters/bi.png",
              "assets/characters/mo.png",
              "assets/characters/zhi.png",
              "assets/characters/yan.png",
              "assets/characters/juan.png",
              "assets/characters/xia.png",
          }
          files = [path for path in root.rglob("*") if path.is_file()]
          for path in files:
              rel = path.relative_to(root).as_posix()
              if path.is_symlink():
                  raise SystemExit("symlink forbidden in Pages artifact: " + rel)
              if "/" not in rel and rel not in allowed_root:
                  raise SystemExit("unexpected Pages root file: " + rel)
              if "/" in rel and not (rel.startswith("updates/") or rel in allowed_character_assets):
                  raise SystemExit("unexpected Pages subtree: " + rel)
              if path.stat().st_size > 1_000_000:
                  raise SystemExit("Pages file exceeds 1 MB: " + rel)
          missing_character_assets = allowed_character_assets - {
              path.relative_to(root).as_posix() for path in files
          }
          if missing_character_assets:
              raise SystemExit(
                  "missing StudyRoom character assets: "
                  + ", ".join(sorted(missing_character_assets))
              )
          print("PAGES_ALLOWLIST=PASS")
          for path in sorted(files):
              print(path.relative_to(root).as_posix())
          PY

          tar \
            --dereference --hard-dereference \
            --directory "_site" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      # Security compatibility marker: path: _site
      # The actual uploaded artifact is a tar created only from the _site allowlist.
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: [self-hosted, Linux, X64, mz-ph-ui]
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
